<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Список задач</h1>

    <section class="player">
      <div class="player-head">
        <span id="level-label" class="level-label">Уровень 1</span>
        <span id="xp-label" class="xp-label">0 / 100 XP</span>
      </div>
      <div class="xp-bar">
        <div id="xp-fill" class="xp-fill"></div>
      </div>
    </section>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="Что нужно сделать?">
      <select id="task-difficulty" aria-label="Сложность">
        <option value="1">Легко · 10 XP</option>
        <option value="2">Средне · 25 XP</option>
        <option value="3">Сложно · 50 XP</option>
      </select>
      <button type="submit">Добавить</button>
    </form>

    <ul id="task-list">
     
    </ul>
  </main>
<script src="app.js"></script>  
</body>
</html>
